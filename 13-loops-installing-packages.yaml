- name: Installing packages using Loops
  hosts: web
  become: yes
  tasks:
    - name: Installing packages
      ansible.builtin.package:
        name: "{{item}}"
        state: present
      loop:
        - mysql
        - nginx
        - git
        - httpd
    
    #Loops in advance way
    - name: Loops in another way
      ansible.builtin.package:
        name: "{{item.name}}"
        state: "{{item.state}}"
        enabled: "{{item.enabled}}"
      loop:
        - {name: mysql, state: present, enabled: true}
        - {name: nginx, state: absent}
        - {name: git, state: present, enabled: true}
        - {name: httpd, state: absent}
        - {name: nginx, state: present, enabled: true}
       
        
