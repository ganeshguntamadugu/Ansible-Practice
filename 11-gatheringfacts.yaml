- name: Gathering facts
  hosts: web
  become: yes
  tasks:
    - name: Prints the facts
      ansible.builtin.debug:
        msg: "{{ansible_facts}}"

    - name: Install package for RedHat
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install package for 
      ansible.builtin.apt:
        name: nginx
        state: present
      when: ansible_os_family == "Ubuntu"